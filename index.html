nav a { /*links da navegação*/
    color: rgb(253, 253, 249); /*cor dos links*/
    margin: 0 30px; /*espaçamento lateral*/
    text-decoration: none; /*remove o sublinhado*/
    font-size: 20px; /*tamanho da fonte*/
}

nav a:hover { /* quando o mause passa sobre o link*/
    text-decoration: underline; /*adiciona sublinhado*/
    color: rgb(242, 242, 245); /*muda a cor*/
}



.fundo { /*container dos cards*/
    background-color: rgb(180, 59, 255); /*ativa flexbox ( lado a lado)*/
    display: flex; /*espaço entre os cards */
    width: 100%; /* ocupa toda a largura */
    height: 100%; /*ocupa toda a altura*/
    flex-wrap: wrap; /* permite quebrar linha*/
    justify-content: space-around; /*distribui os cards*/
    margin-top: 10px; /*espaço acima */
}

.card { /* card individual*/
background-color: rgb(173, 141, 243); /*cor do card */
width: 280px; /*largura fixa*/
text-align: center; /* centraliza o texto*/
border-radius: 8px; /* cantos arredondados*/
height: 250px; /*altura fixa*/
align-items: center; /*centraliza conteúdo*/
padding: 10px; /*espaço interno*/
margin: 30px; /*espaço lateral e horizontal do card*/
color: rgb(2, 2, 44);/*define uma cor para o texto no card*/
height: 350px; /*altura fixa*/

}

.card img { /*imagem do card*/
    width: 100%; /*ocupa toda a largura*/
    height: 80%; /*ocupa 80% da altura*/
    object-fit: cover; /*ajustar sem distorcer */
    border-radius: 15px; /*cantos arredondados*/
}


.card:hover { /*Efeito ao passar o mause*/
    transform: translateY(-10px); scale: (1.02);/*move e aumenta*/
   color: white;
   background-image: url(https://i.gifer.com/Wydl.gif);
   text-shadow: 5px 2px rgb(1, 1, 1);
}
